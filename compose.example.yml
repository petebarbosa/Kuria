# ===============================
# Example Docker Compose file
# ===============================
#
# Purpose:
# --------
#
# This file is an example Docker Compose configuration for self hosting
# Maybe on your local machine or on a cloud VPS.
# The configuration below is a "standard" setup that works out of the box,
# but if you're running this outside of a local network, it is recommended
# to set the environment variables for extra security.
#

x-db-env: &db_env
  POSTGRES_USER: ${POSTGRES_USER:-kuria_user}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kuria_password}
  POSTGRES_DB: ${POSTGRES_DB:-kuria_production}

x-rails-env: &rails_env
  <<: *db_env
  SECRET_KEY_BASE: ${SECRET_KEY_BASE}
  SELF_HOSTED: "true"
  RAILS_FORCE_SSL: "false"
  RAILS_ASSUME_SSL: "false"
  DB_HOST: db
  DB_PORT: 5432
  REDIS_URL: redis://redis:6379/1
  MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN}
  FREECRYPTO_API_KEY: ${FREECRYPTO_API_KEY}
  # --- AI (RubyLLM) ---
  # AI runs exclusively through RubyLLM, calling hosted OpenAI and OpenCode Go
  # APIs directly. No OpenCode Server service is required or started. Set one or
  # both provider keys. Keys are injected from the environment (or encrypted
  # deployment credentials) and are never stored in ordinary application
  # settings. Model selection is explicit per chat: the selectable models are
  # listed from each configured provider, there is no default model or hardcoded
  # list, and there is no automatic fallback.
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENCODE_GO_API_KEY: ${OPENCODE_GO_API_KEY:-}

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - app-storage:/rails/storage
    ports:
      - 3000:3000
    restart: unless-stopped
    environment:
      <<: *rails_env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - kuria_network

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: bundle exec sidekiq
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *rails_env
    networks:
      - kuria_network

  db:
    image: postgres:18.4-trixie
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql
    environment:
      <<: *db_env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - kuria_network

  redis:
    image: redis:8.8.1-trixie
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - kuria_network

  # OpenCode Server (AI assistant backend) is retired as the LLM provider; AI
  # now runs through RubyLLM (see the AI section above). The `opencode` service
  # is intentionally absent and is no longer required or started. Any historical
  # OpenCode volume is retained below for non-destructive migration.

volumes:
  app-storage:
  postgres-data:
  redis-data:
  # Retained for non-destructive migration; no service mounts it now. Do not
  # delete — historical OpenCode data is preserved.
  opencode-config:

networks:
  kuria_network:
    name: kuria_network
    driver: bridge
