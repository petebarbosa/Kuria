# ===============================
# Example Docker Compose file
# ===============================
#
# Purpose:
# --------
#
# This file is an example Docker Compose configuration for self hosting
# Maybe on your local machine or on a cloud VPS.
# The configuration below is a "standard" setup that works out of the box,
# but if you're running this outside of a local network, it is recommended
# to set the environment variables for extra security.
#

x-db-env: &db_env
  POSTGRES_USER: ${POSTGRES_USER:-kuria_user}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kuria_password}
  POSTGRES_DB: ${POSTGRES_DB:-kuria_production}

x-rails-env: &rails_env
  <<: *db_env
  SECRET_KEY_BASE: ${SECRET_KEY_BASE}
  SELF_HOSTED: "true"
  RAILS_FORCE_SSL: "false"
  RAILS_ASSUME_SSL: "false"
  DB_HOST: db
  DB_PORT: 5432
  REDIS_URL: redis://redis:6379/1
  OPENCODE_SERVER_URL: http://opencode:4096
  OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD}
  OPENCODE_DEFAULT_MODEL: ${OPENCODE_DEFAULT_MODEL:-opencode/minimax-m2.5-free}
  MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN}
  FREECRYPTO_API_KEY: ${FREECRYPTO_API_KEY}
  # --- AI provider ---
  # Unset (default) keeps the current OpenCode Server behavior. Set
  # KURIA_LLM_PROVIDER=ruby_llm to opt into the RubyLLM provider.
  KURIA_LLM_PROVIDER: ${KURIA_LLM_PROVIDER:-}
  # RubyLLM provider API keys (used only when KURIA_LLM_PROVIDER=ruby_llm).
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENCODE_GO_API_KEY: ${OPENCODE_GO_API_KEY:-}
  # --- AI: OpenCode Server (transitional) ---
  # OpenCode is the current default while the migration to RubyLLM is in
  # progress. These variables and the `opencode` service are planned for
  # removal after the migration; OpenCode is not intended as a maintained
  # fallback.

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - app-storage:/rails/storage
    ports:
      - 3000:3000
    restart: unless-stopped
    environment:
      <<: *rails_env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - kuria_network

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: bundle exec sidekiq
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      opencode:
        condition: service_healthy
    environment:
      <<: *rails_env
    networks:
      - kuria_network

  db:
    image: postgres:18.4-trixie
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql
    environment:
      <<: *db_env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - kuria_network

  redis:
    image: redis:8.8.1-trixie
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - kuria_network

  # Transitional: OpenCode Server (AI assistant backend). Planned for removal
  # after the migration to RubyLLM; not a maintained fallback.
  opencode:
    image: ghcr.io/anomalyco/opencode:dev
    container_name: maybe-opencode
    command: ["serve", "--port", "4096", "--hostname", "0.0.0.0"]
    restart: unless-stopped
    volumes:
      - opencode-config:/root/.config/opencode
    environment:
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'wget -q -O /dev/null --header "Authorization: Basic $$(printf ''opencode:%s'' "$$OPENCODE_SERVER_PASSWORD" | base64)" http://127.0.0.1:4096/global/health',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - kuria_network
    depends_on:
      web:
        condition: service_started

volumes:
  app-storage:
  postgres-data:
  redis-data:
  opencode-config:

networks:
  kuria_network:
    name: kuria_network
    driver: bridge
